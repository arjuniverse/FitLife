<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FitLife Gym</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <h1>FitLife</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#programs">Programs</a>
      <a href="#trainers">Trainers</a>
      <a href="#contact">Join</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <h2>Transform Your Body</h2>
    <p>Train hard. Stay strong. Live Fit.</p>
    <button>Join Now</button>
  </section>

  <section id="programs" class="section">
    <h2>Our Programs</h2>
    <div class="cards">
      <div class="card">💪 Strength Training</div>
      <div class="card">🔥 Fat Loss</div>
      <div class="card">🧘 Yoga & Flexibility</div>
      <div class="card">⚡ HIIT Workouts</div>
    </div>
  </section>

  <section id="trainers" class="section dark">
    <h2>Expert Trainers</h2>
    <p>Certified professionals to guide your journey.</p>
  </section>

  <section id="contact" class="section">
    <h2>Join FitLife</h2>
    <form id="joinForm">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Email" required />
      <button type="submit">Get Started</button>
    </form>
  </section>

  <footer>
    <p>© 2026 FitLife Gym. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
